# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build and Deploy

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, closed ]
  workflow_dispatch:
env:
  DOCKER_IMAGE_NAME: openeo-job-registry-elastic-api
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm install
    - run: npm run test:cov
    - run: npm run build
    - name: Build container targets
      run: |
        docker build --target elasticsearch -t job-registry:ci-elasticsearch .
        docker build --target postgresql -t job-registry:ci-postgresql .

  pr-image:
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set PR image name
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-pr-${PR_NUMBER}" >> "$GITHUB_ENV"
      - name: Build PR container images
        run: |
          docker build --target elasticsearch \
            -t "$IMAGE_NAME:elasticsearch" \
            -t "$IMAGE_NAME:elasticsearch-${GITHUB_SHA}" .
          docker build --target postgresql \
            -t "$IMAGE_NAME:postgresql" \
            -t "$IMAGE_NAME:postgresql-${GITHUB_SHA}" .
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push PR container images
        run: |
          docker push "$IMAGE_NAME:elasticsearch"
          docker push "$IMAGE_NAME:elasticsearch-${GITHUB_SHA}"
          docker push "$IMAGE_NAME:postgresql"
          docker push "$IMAGE_NAME:postgresql-${GITHUB_SHA}"
      - name: Summarize PR images
        run: |
          {
            echo '### PR container images'
            echo
            echo "- Elasticsearch: \`$IMAGE_NAME:elasticsearch\`"
            echo "- PostgreSQL: \`$IMAGE_NAME:postgresql\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  pr-image-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR container package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}-pr-${{ github.event.number }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package_endpoint="/orgs/${owner}/packages/container/${PACKAGE_NAME}"
          if gh api --silent "$package_endpoint" >/dev/null 2>&1; then
            gh api --method DELETE "$package_endpoint"
            echo "Deleted ghcr.io/${owner}/${PACKAGE_NAME}"
          else
            echo "No PR image package found for ${PACKAGE_NAME}"
          fi

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'npm'
      - run: npm install
      - id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ] || [ "$tag" = "${{ steps.before.outputs.tag }}" ]; then
            echo "No new release created"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          if [ -z "$version" ] || [ "$version" = "0.0.0-semver" ]; then
            echo "Could not determine release version" >&2
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "docker_version=${version}" >> "$GITHUB_OUTPUT"
    outputs:
      released: ${{ steps.version.outputs.released }}
      docker_version: ${{ steps.version.outputs.docker_version }}

  deploy:
    needs: release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm

      - name: Validate version
        run: |
          version="${{ needs.release.outputs.docker_version }}"
          if [ -z "$version" ] || [ "$version" = "0.0.0-semver" ]; then
            echo "Invalid release version: '$version'" >&2
            exit 1
          fi

      - name: Update package.json
        run: npm pkg set version="${{ needs.release.outputs.docker_version }}"

      - run: npm install

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name lowercase
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openeo-job-registry-elastic-api" >> "$GITHUB_ENV"

      - name: Build images
        run: |
          docker build --target elasticsearch \
            -t "$IMAGE_NAME:${{ needs.release.outputs.docker_version }}-elasticsearch" \
            -t "$IMAGE_NAME:latest" .
          docker build --target postgresql \
            -t "$IMAGE_NAME:${{ needs.release.outputs.docker_version }}-postgresql" \
            -t "$IMAGE_NAME:latest-postgresql" .

      - name: Push images
        run: |
          docker push "$IMAGE_NAME:${{ needs.release.outputs.docker_version }}-elasticsearch"
          docker push "$IMAGE_NAME:latest-elasticsearch"
          docker push "$IMAGE_NAME:${{ needs.release.outputs.docker_version }}-postgresql"
          docker push "$IMAGE_NAME:latest-postgresql"
          docker push "$IMAGE_NAME:${{ needs.release.outputs.docker_version }}"
          docker push "$IMAGE_NAME:latest"
